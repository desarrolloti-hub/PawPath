<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPath - Gestión de Mascotas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .form-container input, 
        .form-container select,
        .form-container button {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            flex: 1 1 200px;
        }

        .form-container input:focus,
        .form-container select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-container button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1 1 100%;
        }

        .form-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .form-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .image-preview {
            width: 100%;
            max-width: 200px;
            height: 200px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            overflow: hidden;
            position: relative;
            background: #f5f5f5;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview .placeholder {
            color: #667eea;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .file-input-container {
            flex: 1 1 100%;
            margin: 10px 0;
        }

        .file-input-container input[type="file"] {
            border: none;
            padding: 10px;
            background: #f5f5f5;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
        }

        .file-input-container small {
            display: block;
            color: #666;
            margin-top: 5px;
            font-size: 12px;
        }

        .pets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .pet-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .pet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .pet-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .pet-info {
            padding: 20px;
        }

        .pet-name {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .pet-details {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .pet-details p {
            margin: 5px 0;
        }

        .pet-badge {
            display: inline-block;
            padding: 5px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            margin-right: 5px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (min-width: 768px) {
            .form-container button {
                flex: 0 1 auto;
                padding: 12px 30px;
            }
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .error-message {
            background: #ff4444;
            color: white;
        }

        .success-message {
            background: #00C851;
            color: white;
        }

        .warning-message {
            background: #ffbb33;
            color: #333;
        }

        .image-size-warning {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🐾 PawPath - Gestión de Mascotas 🐾</h2>
        
        <div id="errorMessage" class="message error-message"></div>
        <div id="successMessage" class="message success-message"></div>
        <div id="warningMessage" class="message warning-message"></div>

        <div class="form-container">
            <input type="text" id="name" placeholder="Nombre de la mascota" required>
            <input type="text" id="species" placeholder="Especie (ej: Perro, Gato)" required>
            <input type="number" id="age" placeholder="Edad (años)" required min="0" max="30">
            <select id="gender" required>
                <option value="">Selecciona género</option>
                <option value="Macho">🐕 Macho</option>
                <option value="Hembra">🐩 Hembra</option>
            </select>
            
            <div class="file-input-container">
                <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp">
                <small>Formatos permitidos: JPG, PNG, GIF, WEBP (Máx. 1MB)</small>
                <div id="imageSizeWarning" class="image-size-warning">
                    ⚠️ La imagen es muy grande. Se comprimirá automáticamente.
                </div>
                <div class="image-preview" id="imagePreview">
                    <div class="placeholder">
                        🖼️ Vista previa<br>
                        <small>Selecciona una imagen</small>
                    </div>
                </div>
            </div>
            
            <button onclick="saveItem()" id="saveButton">
                <span id="buttonText">📸 Guardar Mascota</span>
                <span id="loadingSpinner" class="loading-spinner" style="display: none;"></span>
            </button>
        </div>

        <div id="itemList" class="pets-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot,
            query,
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyABACTyV6lId6OAiRorJF_DMXHuCTycMoY",
            authDomain: "pawpath-mx.firebaseapp.com",
            projectId: "pawpath-mx",
            storageBucket: "pawpath-mx.firebasestorage.app",
            messagingSenderId: "511881737688",
            appId: "1:511881737688:web:5326412bffef94f7ecaead"
        };

        // 2. Inicialización de servicios
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        console.log("🔥 Firebase inicializado correctamente");

        const collectionRef = collection(db, "pruebas");
        const q = query(collectionRef, orderBy("timestamp", "desc"));

        // Variables
        let selectedFile = null;
        let isSaving = false;

        // Función para mostrar mensajes
        function showMessage(elementId, message, isError = true) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 4000);
        }

        // Función para comprimir imagen
        function compressImage(file, maxSizeMB = 1) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    
                    img.onload = () => {
                        // Crear canvas
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Calcular nuevas dimensiones (máximo 800px)
                        const maxDimension = 800;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = (height / width) * maxDimension;
                                width = maxDimension;
                            } else {
                                width = (width / height) * maxDimension;
                                height = maxDimension;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        
                        // Dibujar imagen redimensionada
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Comprimir calidad según tamaño
                        let quality = 0.9;
                        let compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        
                        // Si aún es muy grande, reducir calidad
                        while (compressedDataUrl.length > maxSizeMB * 1024 * 1024 * 1.37 && quality > 0.1) {
                            quality -= 0.1;
                            compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        }
                        
                        resolve(compressedDataUrl);
                    };
                    
                    img.onerror = (error) => {
                        reject(error);
                    };
                };
                
                reader.onerror = (error) => {
                    reject(error);
                };
            });
        }

        // 3. Vista previa de imagen
        document.getElementById('imageInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            const sizeWarning = document.getElementById('imageSizeWarning');
            
            if (file) {
                // Validar tipo de archivo
                if (!file.type.startsWith('image/')) {
                    showMessage('errorMessage', '❌ Por favor selecciona una imagen válida');
                    this.value = '';
                    return;
                }
                
                // Mostrar advertencia si es muy grande
                if (file.size > 1024 * 1024) { // 1MB
                    sizeWarning.style.display = 'block';
                } else {
                    sizeWarning.style.display = 'none';
                }
                
                try {
                    // Comprimir imagen para vista previa
                    const compressedImage = await compressImage(file, 1);
                    selectedFile = compressedImage; // Guardar la imagen comprimida en Base64
                    
                    // Mostrar vista previa
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${compressedImage}" alt="Preview">`;
                    
                    console.log("✅ Imagen comprimida lista");
                } catch (error) {
                    console.error("Error al comprimir imagen:", error);
                    showMessage('errorMessage', '❌ Error al procesar la imagen');
                }
            }
        });

        // 4. Función para guardar (TODO en Base64)
        window.saveItem = async () => {
            const name = document.getElementById('name').value.trim();
            const species = document.getElementById('species').value.trim();
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;

            // Validaciones
            if (!name || !species || !age || !gender) {
                showMessage('errorMessage', '⚠️ Por favor completa todos los campos');
                return;
            }

            if (!selectedFile) {
                showMessage('errorMessage', '⚠️ Por favor selecciona una imagen');
                return;
            }

            if (isSaving) {
                showMessage('warningMessage', '⏳ Ya hay una operación en progreso');
                return;
            }

            const saveButton = document.getElementById('saveButton');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            saveButton.disabled = true;
            buttonText.style.display = 'none';
            loadingSpinner.style.display = 'inline-block';
            isSaving = true;

            try {
                console.log("📝 Guardando en Firestore...");
                
                // Crear objeto con los datos
                const docData = {
                    name: name,
                    species: species,
                    age: Number(age),
                    gender: gender,
                    imageBase64: selectedFile, // La imagen en Base64
                    timestamp: new Date().toISOString(),
                    hasImage: true
                };
                
                // Guardar en Firestore
                const docRef = await addDoc(collectionRef, docData);
                
                console.log("✅ Mascota guardada con ID:", docRef.id);
                
                // Mostrar éxito
                showMessage('successMessage', '✅ Mascota guardada exitosamente!', false);
                
                // Limpiar formulario
                document.getElementById('name').value = '';
                document.getElementById('species').value = '';
                document.getElementById('age').value = '';
                document.getElementById('gender').value = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('imagePreview').innerHTML = `
                    <div class="placeholder">
                        🖼️ Vista previa<br>
                        <small>Selecciona una imagen</small>
                    </div>
                `;
                document.getElementById('imageSizeWarning').style.display = 'none';
                
                selectedFile = null;
                
            } catch (error) {
                console.error("❌ ERROR AL GUARDAR:", error);
                showMessage('errorMessage', `❌ Error: ${error.message}`);
                
            } finally {
                saveButton.disabled = false;
                buttonText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
                isSaving = false;
            }
        };

        // 5. Leer en tiempo real
        onSnapshot(q, (snapshot) => {
            console.log("📥 Recibiendo datos de Firestore. Documentos:", snapshot.size);
            const list = document.getElementById('itemList');
            
            if (snapshot.empty) {
                list.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: white; padding: 50px;">
                        <h3>🐾 No hay mascotas registradas</h3>
                        <p>¡Agrega tu primera mascota!</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = "";
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'pet-card';
                
                // Usar la imagen Base64 si existe
                let imageHtml = '';
                if (data.imageBase64) {
                    imageHtml = `<img src="${data.imageBase64}" alt="${data.name}" class="pet-image">`;
                } else {
                    imageHtml = `<div class="pet-image" style="display: flex; align-items: center; justify-content: center; background: #f0f0f0;">
                        <span style="font-size: 48px;">🐾</span>
                    </div>`;
                }
                
                // Formatear fecha
                let fecha = 'Fecha no disponible';
                if (data.timestamp) {
                    try {
                        fecha = new Date(data.timestamp).toLocaleDateString('es-MX', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    } catch (e) {
                        fecha = data.timestamp;
                    }
                }
                
                card.innerHTML = `
                    ${imageHtml}
                    <div class="pet-info">
                        <div class="pet-name">${data.name}</div>
                        <div class="pet-details">
                            <p><span style="font-size: 1.2em;">🐾</span> ${data.species || 'Especie no especificada'}</p>
                            <p><span style="font-size: 1.2em;">🎂</span> ${data.age || '?'} años</p>
                            <p><span style="font-size: 1.2em;">⚥</span> ${data.gender || 'No especificado'}</p>
                        </div>
                        <div>
                            <span class="pet-badge">#${doc.id.slice(-4)}</span>
                            <small style="color: #999; display: block; margin-top: 10px;">
                                📅 ${fecha}
                            </small>
                        </div>
                    </div>
                `;
                
                list.appendChild(card);
            });
        }, (error) => {
            console.error("❌ Error al leer datos:", error);
            document.getElementById('itemList').innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; color: white; padding: 50px;">
                    <h3>❌ Error al cargar datos</h3>
                    <p>${error.message}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
