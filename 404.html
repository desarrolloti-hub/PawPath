<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pagina no encontrada en PawPath">
    <title>404 | Pagina no encontrada</title>
    <style>
        :root {
            --bg-1: #f4fbff;
            --bg-2: #e8f4ff;
            --ink: #113046;
            --muted: #4f687a;
            --brand: #2b8ac6;
            --brand-dark: #1f6e9e;
            --surface: #ffffff;
            --line: #d4e6f3;
            --shadow: 0 18px 45px rgba(17, 48, 70, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 20%, rgba(43, 138, 198, 0.2), transparent 35%),
                radial-gradient(circle at 85% 15%, rgba(98, 167, 214, 0.22), transparent 38%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;
        }

        .blob {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.35;
            z-index: 0;
            animation: drift 9s ease-in-out infinite;
        }

        .blob-one {
            background: #9ad8ff;
            top: -80px;
            left: -70px;
        }

        .blob-two {
            background: #c6f0ff;
            bottom: -100px;
            right: -70px;
            animation-delay: 1.8s;
        }

        .error-card {
            position: relative;
            z-index: 1;
            width: min(700px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 34px;
            text-align: center;
            animation: rise 0.45s ease;
        }

        .code {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: #ff7a7a;
            color: white;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .app-image {
            width: min(220px, 55vw);
            height: auto;
            margin: 4px auto 16px;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(17, 48, 70, 0.18));
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.3rem);
            line-height: 1.06;
            margin-bottom: 14px;
        }

        p {
            max-width: 54ch;
            margin: 0 auto;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--brand);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(43, 138, 198, 0.3);
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            background: var(--brand-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f8fbff;
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            background: #edf7ff;
            transform: translateY(-2px);
        }

        .hint {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #5f7789;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes drift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(8px, -10px) scale(1.05);
            }
        }

        @media (max-width: 640px) {
            .error-card {
                padding: 24px;
                border-radius: 18px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-one" aria-hidden="true"></div>
    <div class="blob blob-two" aria-hidden="true"></div>

    <main class="error-card" role="main">
        <span class="code">Error 404.</span>
        <img class="app-image" src="assets/images/PawPahtLogo.png" alt="Logo de la app PawPath">
        <h1>Aplicacion en desarrollo</h1>
        <p>
            Esta seccion se encuentra en construccion por ahora. Puedes volver al inicio o regresar a la pantalla anterior.
        </p>

        <div class="actions">
            <a class="btn btn-primary" href="index.html">Ir al inicio</a>
            <button class="btn btn-secondary" type="button" onclick="history.back()">Volver atras</button>
        </div>

        <p class="hint">Pronto estara disponible con nuevas funciones para ti y tu mascota.</p>
    </main>
</body>
</html>
