<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Mascotas · PawPath</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="mascotas.css">
    <!-- <link rel="stylesheet" href="/user/visitor/login/login.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="pet-page" style="margin: 0;">
    <navbar-visitor></navbar-visitor>
    <main class="pet-main">
        <div class="container">
            <div class="header">
                <div class="auth-logo">🐾</div>
                <h1>Mis Mascotas</h1>
                <p>Administra el perfil y bienestar de tus compañeros</p>
                <button id="btnAgregarMascota" class="btn-agregar">
                    <i class="fas fa-plus"></i> Nueva Mascota
                </button>
            </div>

            <div class="content">
                <div id="contenedorMascotas" class="pet-cards">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Cargando tus mascotas...</p>
                    </div>
                </div>
            </div>
        </div>


        <div id="modalMascota" class="modal-backdrop">
            <div class="modal-form">
                <div class="auth-header">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <h2 id="modalTitle">Registrar Mascota</h2>
                        <span id="btnCerrarModal" class="close-modal">&times;</span>
                    </div>
                    <p class="auth-subtitle">Completa los datos de tu mascota</p>
                </div>

                <div class="form-container">
                    <input type="hidden" id="mascotaId">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nombreMascota"><i class="fas fa-tag"></i> Nombre *</label>
                            <input type="text" id="nombreMascota" placeholder="Ej: Luna" required>
                        </div>

                        <div class="form-group">
                            <label for="especieMascota"><i class="fas fa-dog"></i> Especie *</label>
                            <select id="especieMascota" required>
                                <option value="">Seleccione una especie</option>
                                <option value="Perro">🐕 Perro</option>
                                <option value="Gato">🐈 Gato</option>
                                <option value="Ave">🦜 Ave</option>
                                <option value="Roedor">🐭 Roedor</option>
                                <option value="Reptil">🦎 Reptil</option>
                                <option value="Otro">Otro</option>

                            </select>
                        </div>

                        <div class="form-group">
                            <label for="generoMascota"><i class="fas fa-venus-mars"></i> Género</label>
                            <select id="generoMascota">
                                <option value="">Seleccione un género</option>
                                <option value="Macho">♂ Macho</option>
                                <option value="Hembra">♀ Hembra</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="razaMascota"><i class="fas fa-dna"></i> Raza</label>
                            <input type="text" id="razaMascota" placeholder="Ej: Labrador">
                        </div>

                        <div class="form-group">
                            <label for="coloresMascota"><i class="fas fa-palette"></i> Color</label>
                            <input type="text" id="coloresMascota" placeholder="Ej: Café con blanco">
                        </div>

                        <div class="form-group">
                            <label for="edadMascota"><i class="fas fa-calendar-alt"></i> Edad (Años)</label>
                            <input type="number" id="edadMascota" step="1" placeholder="Ej: 2">
                        </div>

                        <div class="form-group">
                            <label for="pesoMascota"><i class="fas fa-weight"></i> Peso (kg)</label>
                            <input type="number" id="pesoMascota" step="0.1" placeholder="Ej: 15.5">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="microchipMascota"><i class="fas fa-microchip"></i> Número de Microchip</label>
                        <input type="text" id="microchipMascota" placeholder="Código de identificación">
                    </div>

                    <div class="form-group full-width">
                        <label><i class="fas fa-stethoscopes"></i> ¿Está esterilizado? *</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="esterilizado" value="Sí"> Sí
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="esterilizado" value="No" checked> No
                            </label>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="historialMedico"><i class="fas fa-notes-medical"></i> Historial / Notas
                            Médicas</label>
                        <textarea id="historialMedico" rows="3"
                            placeholder="Alergias, vacunas pendientes, etc."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label><i class="fas fa-camera"></i> Foto de perfil</label>
                        <div class="pet-photo-uploader">
                            <div id="fotoPreview" class="photo-preview">
                                <img id="fotoPreviewImg" src="" alt="Vista previa" style="display:none;" />
                                <i id="placeholderIcon" class="fas fa-image"></i>
                            </div>
                            <input type="file" id="fotoMascota" accept="image/*">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button id="btnGuardar" class="btn-save">
                            <i class="fas fa-save"></i> Guardar Mascota
                        </button>
                        <button type="button" class="btn-cancel" onclick="mascotasController.cerrarModal()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <main-footer></main-footer>
    <script type="module" src="/user/visitor/Mascotas/mascotas.js"></script>
    <script type="module" src="/components/JS navbar-visitor-component.js"></script>
    <script type="module" src="/components/JS ads-banner-component.js"></script>
    <script type="module" src="/components/JS forum-card-component.js"></script>
    <script type="module" src="/components/JS FooterVisitor.js"></script>
    <script type="module" src="/index.js"></script>
</body>

</html>
