<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/PawPahtLogo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Gestión de Veterinarios</title>

    <style>
        /* Contenedor principal de veterinarios */
        .container-all-vet {
            width: 100%;
            max-width: 1500px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* Header con título y buscador */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-header h1 {
            font-size: 2rem;
            color: #1a202c;
            font-weight: 600;
            margin: 0;
        }

        .page-header h1 i {
            color: #667eea;
            margin-right: 10px;
        }

        /* Buscador */
        .search-container {
            position: relative;
            width: 300px;
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: white;
        }

        .search-container input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.15);
        }

        /* Grid de tarjetas */
        .veterinarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        /* Tarjeta */
        .vet-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #edf2f7;
        }

        .vet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
        }

        .vet-card.suspendido {
            opacity: 0.8;
            background: #fff5f5;
            border-left: 4px solid #dc3545;
        }

        /* Header de la tarjeta */
        .vet-card-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #edf2f7;
            position: relative;
        }

        /* Foto */
        .vet-foto {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #667eea;
            cursor: pointer;
            flex-shrink: 0;
        }

        .vet-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Info del veterinario */
        .vet-info-header {
            flex: 1;
            min-width: 0;
        }

        .vet-nombre {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vet-cedula {
            font-size: 0.85rem;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vet-cedula i {
            flex-shrink: 0;
        }

        .vet-cedula:hover {
            color: #5a67d8;
        }

        /* Estado */
        .vet-estado {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .estado-activo {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .estado-suspendido {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Cuerpo de la tarjeta */
        .vet-card-body {
            padding: 20px;
        }

        .vet-especialidad {
            display: inline-block;
            padding: 6px 12px;
            background: #f7fafc;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: #2d3748;
            border: 1px solid #e2e8f0;
        }

        .vet-especialidad i {
            color: #667eea;
            margin-right: 5px;
        }

        .vet-contacto {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contacto-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4a5568;
            font-size: 0.9rem;
        }

        .contacto-item i {
            width: 20px;
            color: #667eea;
            flex-shrink: 0;
        }

        .contacto-item span {
            word-break: break-all;
        }

        /* Footer */
        .vet-card-footer {
            padding: 15px 20px;
            border-top: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }

        .btn-ver {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .btn-ver:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-ver i {
            font-size: 1rem;
        }

        .text-muted {
            color: #718096;
            font-size: 0.8rem;
            font-style: italic;
        }

        /* Mensaje sin resultados */
        .no-veterinarios {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: #718096;
            font-size: 1.1rem;
            background: white;
            border-radius: 20px;
            border: 2px dashed #e2e8f0;
        }

        .no-veterinarios i {
            color: #667eea;
            margin-right: 10px;
        }

        /* Responsive ajustado para el sidebar */
        @media (max-width: 1024px) {
            .veterinarios-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }

        @media (max-width: 780px) {
            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px 15px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .search-container {
                width: 100%;
            }

            .veterinarios-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .vet-card-header {
                flex-wrap: wrap;
            }

            .vet-estado {
                position: static;
                margin-top: 10px;
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .main {
                padding: 15px 10px;
            }

            .vet-card-header {
                flex-direction: column;
                text-align: center;
            }

            .vet-info-header {
                width: 100%;
            }

            .vet-cedula {
                justify-content: center;
            }

            .vet-card-footer {
                flex-direction: column;
                gap: 10px;
            }

            .btn-ver {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <navbar-admin></navbar-admin>
    <script src="/components/navbar-admin-component.js"></script>
    <!--Buscador-->
    <div class="container-all-vet">
        <!-- Grid de veterinarios -->
        <div class="veterinarios-grid" id="contenedorVeterinarios">
            <div class="no-veterinarios">
                <i class="fas fa-spinner fa-spin"></i> Cargando veterinarios...
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="admin_veterinariosController.js"></script>
</body>

</html>
