<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/PawPahtLogo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="gestionVeterinarios.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Administrador - Gestión de Veterinarios</title>
</head>

<body>
    <navbar-admin></navbar-admin>
     <script type="module" src="/components/navbar-admin-component.js"></script>

    <div class="container-all-vet">
        <!-- Header con título y buscador -->
        <div class="page-header">
            <h1>
                <i class="fas fa-user-md"></i>
                Veterinarios Registrados
            </h1>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="buscarVeterinario"
                    placeholder="Buscar veterinario por nombre, especialidad o clínica...">
            </div>
        </div>

        <!-- Grid de veterinarios -->
        <div class="veterinarios-grid" id="contenedorVeterinarios">
            <div class="no-veterinarios">
                <i class="fas fa-spinner fa-spin"></i> Cargando veterinarios...
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="admin_veterinariosController.js"></script>
</body>

</html>
