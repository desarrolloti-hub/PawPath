<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/PawPahtLogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="gestionUsuarios.css">
    <title>Administrador</title>
</head>

<body>
    <navbar-admin></navbar-admin>
    <script src="/components/navbar-admin-component.js"></script>

    <!--Buscador-->
    <div class="tabla-header">
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="buscarNombre" placeholder="Buscar por nombre...">
        </div>
    </div>
    <!--TABLA DE GESTION DE USUARIOS-->
    <div class="tabla-responsive">
        <table class="user-admin-table" id="tablaUsuarios">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios">
                <tr>
                    <td colspan="4">
                        <i class="fas fa-spinner fa-spin"></i> Cargando usuarios...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
<script src="admin_usuariosController.js"></script>
</html>
