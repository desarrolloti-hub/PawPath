<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/PawPahtLogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="gestionUsuarios.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Administrador</title>
</head>

<body>
    <navbar-admin></navbar-admin>
    <script src="/components/navbar-admin-component.js"></script>
    <div class="container-all">
        <!--Buscador-->
        <div class="tabla-header">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="buscarNombre" placeholder="Buscar por nombre...">
            </div>
        </div>
        <!--TABLA DE GESTION DE USUARIOS-->
        <div class="tabla-responsive">
            <table class="user-admin-table" id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Fecha de registro</th>
                        <th>Rol</th>
                        <th colspan="2">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <tr>
                        <td colspan="5">
                            <i class="fas fa-spinner fa-spin"></i> Cargando usuarios...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Modal de Confirmación para Eliminar Usuario -->
    <div class="modal fade" id="modalConfirmarEliminar" tabindex="-1" aria-labelledby="modalConfirmarEliminarLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalConfirmarEliminarLabel">
                        <i class="fas fa-exclamation-triangle text-warning"></i> Confirmar Eliminación
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro de que deseas eliminar este usuario?</p>
                    <p class="text-danger"><small>Esta acción no se puede deshacer.</small></p>

                    <!-- Mostrar información del usuario (opcional) -->
                    <div class="alert alert-info" id="infoUsuarioEliminar" style="display: none;">
                        <strong>Usuario:</strong> <span id="nombreUsuarioEliminar"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="module" src="admin_usuariosController.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
