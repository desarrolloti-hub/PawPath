<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/images/PawPahtLogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../GestionUsuarios/gestionUsuarios.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Administrador - Gestión de Mascotas</title>
    <style>
        .user-admin-table img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .tabla-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .tabla-header h2 {
            font-size: 1.5rem;
            color: #2d3748;
            margin: 0;
        }

        .tabla-header h2 i {
            color: #667eea;
            margin-right: 10px;
        }

        .container-all {
            padding: 20px 30px;
            margin-left: 240px;
            width: calc(100% - 240px);
        }

        @media (max-width: 768px) {
            .container-all {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <navbar-admin></navbar-admin>
     <script type="module" src="/components/navbar-admin-component.js"></script>
    
    <div class="container-all">
        <!-- Header sin buscador -->
        <div class="tabla-header">
            <h2>
                <i class="fas fa-paw"></i>
                Gestión de Mascotas
            </h2>
        </div>

        <!-- TABLA DE GESTION DE MASCOTAS -->
        <div class="tabla-responsive">
            <table class="user-admin-table" id="tablaMascotas">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Género</th>
                        <th>Edad</th>
                        <th>Peso</th>
                        <th>Raza</th>
                        <th>Foto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-mascotas">
                    <tr>
                        <td colspan="9" class="text-center">
                            <i class="fas fa-spinner fa-spin"></i> Cargando mascotas...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Confirmación para Eliminar Mascota -->
    <div class="modal fade" id="modalConfirmarEliminar" tabindex="-1" aria-labelledby="modalConfirmarEliminarLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalConfirmarEliminarLabel">
                        <i class="fas fa-exclamation-triangle text-warning"></i> Confirmar Eliminación
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro de que deseas eliminar esta mascota?</p>
                    <p class="text-danger"><small>Esta acción no se puede deshacer.</small></p>

                    <!-- Mostrar información de la mascota -->
                    <div class="alert alert-info" id="infoMascotaEliminar" style="display: none;">
                        <strong>Mascota:</strong> <span id="nombreMascotaEliminar"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="admin_mascotasController.js"></script>
</body>

</html>
